<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏍️ Full Inyección - Escáneres y Herramientas para Motos</title>
    <style>
        * {margin:0; padding:0; box-sizing:border-box; font-family:Arial, sans-serif;}
        body {background:#0f172a; color:#f8fafc; padding-bottom:80px;}
        header {background:#1e293b; padding:1.5rem; text-align:center; border-bottom:3px solid #f59e0b;}
        h1 {color:#f59e0b; font-size:1.6rem;}
        .subtitulo {color:#94a3b8; margin-top:0.5rem; font-size:0.95rem;}
        .contenedor {max-width:1200px; margin:0 auto; padding:1.5rem;}
        h2 {text-align:center; margin-bottom:2rem; font-size:1.5rem; color:#f59e0b;}

        /* ========== PRODUCTO CON GALERÍA PROFESIONAL ========== */
        .producto {background:#1e293b; border-radius:16px; padding:1.5rem; margin-bottom:2rem; overflow:hidden;}
        .producto-contenido {display:grid; grid-template-columns:1fr 1fr; gap:2rem;}
        
        /* 📸 GALERÍA DE IMÁGENES — ¡IMAGEN SIEMPRE DENTRO DE SU CAJA! ✅ */
        .galeria {position:relative; display:flex; flex-direction:column;}
        
        /* 🖼️ CAJA FIJA — LA IMAGEN NUNCA SE SALE DE AQUÍ ✅ */
        .caja-imagen-principal {
            width:100%;
            height:400px;
            border-radius:12px;
            background:#334155;
            overflow:hidden; /* ⭐ CLAVE: TODO LO QUE SE SALGA SE OCULTA ✅ */
            position:relative;
            display:flex;
            align-items:center;
            justify-content:center;
        }
        
        .imagen-principal {
            width:100%;
            height:100%;
            object-fit:contain; /* ⭐ CLAVE: AJUSTA SIN RECORTAR ✅ */
            cursor:zoom-in;
            transition:transform 0.3s ease;
            background:#334155;
        }
        .imagen-principal.zoom {transform:scale(1.5); cursor:zoom-out;}
        
        /* 🎬 VIDEO — TAMBIÉN DENTRO DE LA MISMA CAJA ✅ */
        .video-principal {
            width:100%;
            height:100%;
            border-radius:12px;
            background:#000;
        }
        
        /* 📱 MINIATURAS */
        .miniaturas {
            display:flex;
            gap:0.8rem;
            margin-top:1rem;
            overflow-x:auto;
            padding-bottom:0.5rem;
            scrollbar-width:thin;
            flex-shrink:0;
        }
        .miniatura {
            width:80px;
            height:60px;
            object-fit:cover;
            border-radius:8px;
            cursor:pointer;
            border:3px solid transparent;
            transition:all 0.2s;
            flex-shrink:0;
            background:#334155;
        }
        .miniatura:hover {border-color:#f59e0b; transform:scale(1.05);}
        .miniatura.activa {border-color:#f59e0b; box-shadow:0 0 0 2px #f59e0b;}
        
        /* 🎬 MINIATURA DE VIDEO */
        .miniatura-video {position:relative;}
        .miniatura-video::after {
            content:"▶";
            position:absolute;
            top:50%; left:50%;
            transform:translate(-50%, -50%);
            background:rgba(0,0,0,0.7);
            color:white;
            border-radius:50%;
            width:30px; height:30px;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:12px;
        }

        /* 📝 INFO DEL PRODUCTO */
        .info-producto h3 {color:#f59e0b; font-size:1.5rem; margin-bottom:1rem;}
        .descripcion {color:#cbd5e1; font-size:1rem; line-height:1.6; margin-bottom:1.5rem;}
        .precio {font-size:2rem; font-weight:bold; color:#22c55e; margin:1.5rem 0;}
        .precio span {font-size:1rem; color:#94a3b8;}
        button {
            width:100%;
            padding:1rem;
            background:#25d363;
            color:white;
            border:none;
            border-radius:10px;
            font-weight:bold;
            font-size:1.1rem;
            cursor:pointer;
            transition:all 0.2s;
        }
        button:hover {background:#12b74d; transform:translateY(-2px); box-shadow:0 4px 12px rgba(37,211,99,0.3);}

        /* 📱 RESPONSIVE — CELULAR PERFECTO ✅ */
        @media (max-width:768px) {
            .producto-contenido {grid-template-columns:1fr;}
            .caja-imagen-principal {height:300px;}
        }

        .cargando {text-align:center; color:#94a3b8; padding:3rem; font-size:1.1rem;}
        footer {
            text-align:center;
            padding:2rem;
            color:#64748b;
            margin-top:3rem;
            border-top:1px solid #334155;
            font-size:0.9rem;
        }
    </style>
</head>
<body>
    <header>
        <h1>🏍️ FULL INYECCIÓN</h1>
        <p class="subtitulo">Cables, Escáneres y Herramientas de Diagnóstico para Motos y Carros</p>
    </header>

    <div class="contenedor">
        <h2>📦 Nuestros Productos</h2>
        <div id="lista-productos">
            <div class="cargando">⏳ Cargando productos desde la nube...</div>
        </div>
    </div>

    <footer>
        <p>📍 Medellín, Colombia 🇨🇴 | 📱 WhatsApp: +57 316 718 8394</p>
        <p>🚚 Envíos a todo el país | 🏍️ Full Inyección © 2026</p>
    </footer>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
  import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCe5Tj9FOXxwX71OocngC1XbjqZNo76muM",
    authDomain: "full-inyeccion.firebaseapp.com",
    projectId: "full-inyeccion",
    storageBucket: "full-inyeccion.firebasestorage.app",
    messagingSenderId: "279801018722",
    appId: "1:279801018722:web:ba3c95e7598ebebdadd43b"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // 📸 Renderizar galería — IMAGEN SIEMPRE DENTRO DE SU CAJA ✅
  function renderizarGaleria(producto) {
    const imagenes = producto.imagenes || [];
    const videos = producto.videos || [];
    const todos = [...imagenes, ...videos];

    if (todos.length === 0) {
      return `
        <div class="galeria">
          <div class="caja-imagen-principal">
            <div style="color:#94a3b8; text-align:center;">📷 Sin imagen disponible</div>
          </div>
        </div>
      `;
    }

    return `
      <div class="galeria">
        <!-- 🖼️ CAJA FIJA — TODO SE MANTIENE ADENTRO ✅ -->
        <div class="caja-imagen-principal">
          ${todos.length > 0 ? 
            (todos[0].includes('youtube') || todos[0].includes('youtu.be') || todos[0].includes('video')) ?
              `<iframe class="video-principal" id="media-principal" src="${todos[0]}" frameborder="0" allowfullscreen allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"></iframe>` :
              `<img src="${todos[0]}" class="imagen-principal" id="media-principal" alt="${producto.nombre}" onclick="this.classList.toggle('zoom')">`
            : `<div style="color:#94a3b8; text-align:center;">📷 Sin imagen</div>`
          }
        </div>
        
        <!-- 📱 Miniaturas abajo -->
        ${todos.length > 1 ? `
          <div class="miniaturas">
            ${todos.map((url, i) => {
              const esVideo = url.includes('youtube') || url.includes('youtu.be') || url.includes('video');
              return `
                <img src="${esVideo ? 'https://via.placeholder.com/80x60/1e293b/25d363?text=▶' : url}" 
                     class="miniatura ${i === 0 ? 'activa' : ''} ${esVideo ? 'miniatura-video' : ''}"
                     onclick="cambiarMedia('${url}', ${i}, this)"
                     alt="Vista ${i+1}">
              `;
            }).join('')}
          </div>
        ` : ''}
      </div>
    `;
  }

  // 📦 Cargar productos desde Firebase
  async function cargarProductos() {
    const contenedor = document.getElementById('lista-productos');
    try {
      const querySnapshot = await getDocs(collection(db, "productos"));
      contenedor.innerHTML = "";

      if (querySnapshot.empty) {
        contenedor.innerHTML = `
          <div style="text-align:center; padding:4rem 2rem; color:#94a3b8;">
            <h3 style="color:#f59e0b; margin-bottom:1rem;">🏍️ Próximamente...</h3>
            <p>Aún no hay productos publicados. Vuelve pronto para ver nuestro catálogo completo de escáneres y herramientas.</p>
          </div>
        `;
        return;
      }

      querySnapshot.forEach((docSnap) => {
        const p = docSnap.data();
        
        contenedor.innerHTML += `
          <div class="producto">
            <div class="producto-contenido">
              ${renderizarGaleria(p)}
              <div class="info-producto">
                <h3>${p.nombre || 'Producto sin nombre'}</h3>
                <p class="descripcion">${p.descripcion || 'Sin descripción disponible'}</p>
                <div class="precio">$ ${p.precio ? Number(p.precio).toLocaleString('es-CO') : '0'} <span>COP</span></div>
                <a href="https://wa.me/573167188394?text=Hola! Quiero comprar: ${encodeURIComponent(p.nombre || '')}" target="_blank" style="text-decoration:none;">
                  <button>💬 Pedir por WhatsApp</button>
                </a>
              </div>
            </div>
          </div>
        `;
      });
    } catch (error) {
      contenedor.innerHTML = `<div class="cargando">❌ Error cargando productos: ${error.message}</div>`;
    }
  }

  // 🔄 Cambiar imagen/video principal — TODO DENTRO DE LA CAJA ✅
  window.cambiarMedia = function(url, indice, miniatura) {
    const cajaPrincipal = miniatura.closest('.galeria').querySelector('.caja-imagen-principal');
    const todasMiniaturas = miniatura.parentElement.querySelectorAll('.miniatura');
    
    todasMiniaturas.forEach(m => m.classList.remove('activa'));
    miniatura.classList.add('activa');

    const esVideo = url.includes('youtube') || url.includes('youtu.be') || url.includes('video');
    
    if (esVideo) {
      cajaPrincipal.innerHTML = `<iframe class="video-principal" id="media-principal" src="${url}" frameborder="0" allowfullscreen allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"></iframe>`;
    } else {
      cajaPrincipal.innerHTML = `<img src="${url}" class="imagen-principal" id="media-principal" alt="Vista principal" onclick="this.classList.toggle('zoom')">`;
    }
  };

  cargarProductos();
</script>
</body>
</html>
